apiVersion: v1
kind: Namespace
metadata:
  name: efferva
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: efferva
  namespace: efferva
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller
  namespace: efferva
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: efferva-sandbox-controller
  namespace: efferva
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-controller
subjects:
  - kind: ServiceAccount
    name: efferva
    namespace: efferva
---
apiVersion: v1
kind: Secret
metadata:
  name: efferva-postgres
  namespace: efferva
type: Opaque
stringData:
  username: efferva
  password: efferva
  database-url: postgresql://efferva:efferva@postgres:5432/efferva
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: efferva
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: efferva
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: efferva-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efferva-postgres
                  key: password
            - name: POSTGRES_DB
              value: efferva
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "efferva", "-d", "efferva"]
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: efferva
  namespace: efferva
spec:
  selector:
    app: efferva
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efferva
  namespace: efferva
spec:
  replicas: 2
  selector:
    matchLabels:
      app: efferva
  template:
    metadata:
      labels:
        app: efferva
    spec:
      serviceAccountName: efferva
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432; do sleep 1; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 70
      containers:
        - name: app
          image: efferva-app:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
          env:
            - name: EFFERVA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: efferva-postgres
                  key: database-url
            - name: EFFERVA_SANDBOX_PROVIDER
              value: kubernetes
            - name: EFFERVA_SANDBOX_IMAGE
              value: efferva-sandbox:local
            - name: EFFERVA_KUBERNETES_NAMESPACE
              value: efferva
            - name: CODEX_HOME
              value: /var/lib/efferva/codex
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: efferva-openai
                  key: api-key
                  optional: true
            - name: EFFERVA_CODEX_OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: efferva-openai
                  key: base-url
                  optional: true
            - name: EFFERVA_CODEX_MODEL
              valueFrom:
                secretKeyRef:
                  name: efferva-openai
                  key: model
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: codex-home
              mountPath: /var/lib/efferva/codex
      volumes:
        - name: codex-home
          emptyDir: {}
