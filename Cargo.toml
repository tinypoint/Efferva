[workspace]
members = [
    "crates/postgres-thread-store",
    "crates/codex-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

codex-app-server = { path = "../codex/codex-rs/app-server" }
codex-arg0 = { path = "../codex/codex-rs/arg0" }
codex-config = { path = "../codex/codex-rs/config" }
codex-exec-server = { path = "../codex/codex-rs/exec-server" }
codex-git-utils = { path = "../codex/codex-rs/git-utils" }
codex-http-client = { path = "../codex/codex-rs/http-client" }
codex-protocol = { path = "../codex/codex-rs/protocol" }
codex-rollout = { path = "../codex/codex-rs/rollout" }
codex-state = { path = "../codex/codex-rs/state" }
codex-thread-store = { path = "../codex/codex-rs/thread-store" }
codex-utils-cli = { path = "../codex/codex-rs/utils/cli" }

# Keep the thin runtime compatible with the exact transport forks used by Codex.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# Keep container builds within the memory budget of local Docker Desktop and
# ordinary CI runners. Thin LTO adds little value to the control plane but
# substantially increases peak linker memory for the Codex dependency graph.
[profile.container]
inherits = "release"
lto = false
codegen-units = 16
strip = "symbols"
