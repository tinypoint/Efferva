<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentFrame</title>
    <link rel="stylesheet" href="static/style.css?v=2" />
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          <span class="mark">AF</span>
          <div>
            <strong id="product-title">AgentFrame</strong>
            <small>Codex runtime</small>
          </div>
        </div>
        <button id="new-session" class="primary">＋ 新建 Session</button>
        <div class="identity">
          <small>当前身份</small>
          <span id="principal">加载中…</span>
        </div>
        <div id="session-scope" class="session-scope hidden">
          <button id="scope-mine" class="active">我的</button>
          <button id="scope-tenant">全租户</button>
        </div>
        <div id="sessions" class="sessions"></div>
      </aside>
      <main>
        <header>
          <div>
            <small id="session-label">选择一个 Session</small>
            <h1 id="thread-title">开始构建</h1>
          </div>
          <button id="new-thread" disabled>新建 Thread</button>
        </header>
        <section id="empty" class="empty">
          <div class="orb"></div>
          <h2>一个工作区，多条并行 Thread</h2>
          <p>创建 Session 后开始多轮对话。Run 会在浏览器断线后继续执行。</p>
        </section>
        <section id="chat" class="chat hidden">
          <div id="messages" class="messages"></div>
          <div id="run-status" class="run-status" aria-live="polite"></div>
          <div id="read-only" class="read-only hidden">当前 Session 为只读</div>
          <form id="composer">
            <textarea id="prompt" rows="3" placeholder="让 Codex 在沙盒中完成任务…"></textarea>
            <button id="send" class="send" type="submit">发送</button>
          </form>
        </section>
      </main>
    </div>
    <dialog id="create-dialog">
      <form id="create-form">
        <div>
          <small id="create-eyebrow">创建</small>
          <h2 id="create-title">新建</h2>
        </div>
        <label for="create-name" id="create-label">名称</label>
        <input id="create-name" name="name" maxlength="120" required />
        <div class="dialog-actions">
          <button id="create-cancel" type="button">取消</button>
          <button class="primary" type="submit">创建</button>
        </div>
      </form>
    </dialog>
    <script src="static/app.js?v=2" type="module"></script>
  </body>
</html>
