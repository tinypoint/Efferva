[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "efferva-multi-session-claude-code"
version = "0.1.0"
description = "A multi-session Claude Code product with one Sandbox per Session."
requires-python = ">=3.11"
dependencies = [
    "efferva[opensandbox]==0.1.0",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_session_claude_code"]
