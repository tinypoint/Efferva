name: efferva-multi-session-claude-code

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: efferva
      POSTGRES_USER: efferva
      POSTGRES_PASSWORD: efferva
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efferva -d efferva"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - efferva-multi-session-claude-code

  opensandbox-server:
    image: opensandbox/server:v0.2.2
    restart: unless-stopped
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "${OPENSANDBOX_HTTP_PORT:-8090}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - efferva-multi-session-claude-code

  app:
    image: efferva-multi-session-claude-code:local
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: examples/multi-session-claude-code/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox-server:
        condition: service_healthy
    environment:
      EFFERVA_DATABASE_URL: postgresql://efferva:efferva@postgres:5432/efferva
      EFFERVA_SANDBOX_IMAGE: ${EFFERVA_SANDBOX_IMAGE:-python:3.13-slim-bookworm}
      EFFERVA_OPENSANDBOX_SERVER_URL: http://opensandbox-server:8090
      EFFERVA_OPENSANDBOX_API_KEY: local-dev-key
      EFFERVA_OPENSANDBOX_USE_SERVER_PROXY: "false"
      EFFERVA_OPENSANDBOX_CREDENTIAL_PROXY_ENABLED: ${EFFERVA_OPENSANDBOX_CREDENTIAL_PROXY_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "${EFFERVA_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/agent/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      - efferva-multi-session-claude-code

volumes:
  postgres-data:
  opensandbox-data:

networks:
  efferva-multi-session-claude-code:
    name: efferva-multi-session-claude-code
