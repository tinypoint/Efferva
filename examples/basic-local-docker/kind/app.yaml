apiVersion: v1
kind: Namespace
metadata:
  name: efferva
---
apiVersion: v1
kind: Namespace
metadata:
  name: efferva-sandboxes
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: efferva
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: efferva
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: efferva
            - name: POSTGRES_USER
              value: efferva
            - name: POSTGRES_PASSWORD
              value: efferva
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "efferva", "-d", "efferva"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: efferva
  namespace: efferva
spec:
  selector:
    app: efferva
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efferva
  namespace: efferva
spec:
  replicas: 2
  selector:
    matchLabels:
      app: efferva
  template:
    metadata:
      labels:
        app: efferva
    spec:
      containers:
        - name: app
          image: efferva-basic-local-docker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: EFFERVA_DATABASE_URL
              value: postgresql://efferva:efferva@postgres:5432/efferva
            - name: EFFERVA_SANDBOX_IMAGE
              value: python:3.13-slim-bookworm
            - name: EFFERVA_OPENSANDBOX_SERVER_URL
              value: http://opensandbox-server.opensandbox-system.svc.cluster.local
            - name: EFFERVA_OPENSANDBOX_API_KEY
              value: local-dev-key
            - name: EFFERVA_OPENSANDBOX_USE_SERVER_PROXY
              value: "false"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: efferva-secrets
                  key: openai-api-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /agent/healthz
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
