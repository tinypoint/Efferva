[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "efferva-basic-local-docker"
version = "0.1.0"
description = "A standalone local Docker product using Efferva and OpenSandbox."
requires-python = ">=3.11"
dependencies = [
    "efferva[opensandbox]==0.1.0",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basic_local_docker"]
