<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Coding Lab</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <span>EL</span>
        <div>
          <strong>Local Coding Lab</strong>
          <small>Powered by Efferva</small>
        </div>
      </div>

      <button id="new-session" class="primary">New session</button>
      <div id="sessions" class="sessions"></div>
    </aside>

    <main>
      <header>
        <div>
          <small id="session-name">No session selected</small>
          <h1 id="thread-name">Choose a thread</h1>
        </div>
        <button id="new-thread" disabled>New thread</button>
      </header>

      <section id="welcome" class="welcome">
        <div class="spark">✦</div>
        <h2>Your sandbox coding workspace</h2>
        <p>Create a session, open a thread, and give Codex a task.</p>
      </section>

      <section id="chat" class="chat hidden">
        <div id="messages" class="messages"></div>
        <div id="status" class="status"></div>
        <form id="composer">
          <textarea
            id="prompt"
            rows="3"
            placeholder="Ask Codex to inspect or change the workspace…"
          ></textarea>
          <button type="submit" class="send">Send</button>
        </form>
      </section>
    </main>

    <dialog id="create-dialog">
      <form id="create-form">
        <small id="create-kind">Session</small>
        <h2 id="create-title">Create session</h2>
        <label id="name-field">
          Name
          <input id="create-name" maxlength="120" required />
        </label>
        <label id="workspace-field" class="hidden">
          Workspace
          <input
            id="create-workspace"
            placeholder="/home/sandbox/workspace"
          />
        </label>
        <div class="dialog-actions">
          <button id="cancel-create" type="button">Cancel</button>
          <button type="submit" class="primary">Create</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
