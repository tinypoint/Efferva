name: efferva-basic-local-docker

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: efferva
      POSTGRES_USER: efferva
      POSTGRES_PASSWORD: efferva
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efferva -d efferva"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - efferva-local

  sandbox-image:
    image: efferva-sandbox:local
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: sandbox
    entrypoint: ["/bin/true"]
    networks:
      - efferva-local

  opensandbox-server:
    image: opensandbox/server:v0.2.2
    restart: unless-stopped
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "${OPENSANDBOX_HTTP_PORT:-8090}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    networks:
      - efferva-local

  app:
    image: efferva-basic-local-docker:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EFFERVA_VERSION: ${EFFERVA_VERSION:-0.1.0}
        EFFERVA_WHEEL_URL: ${EFFERVA_WHEEL_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox-server:
        condition: service_healthy
    environment:
      EFFERVA_DATABASE_URL: postgresql://efferva:efferva@postgres:5432/efferva
      EFFERVA_SANDBOX_PROVIDER: opensandbox
      EFFERVA_SANDBOX_IMAGE: efferva-sandbox:local
      EFFERVA_OPENSANDBOX_SERVER_URL: http://opensandbox-server:8090
      EFFERVA_OPENSANDBOX_API_KEY: local-dev-key
      EFFERVA_OPENSANDBOX_USE_SERVER_PROXY: "true"
      EFFERVA_PUBLIC_BASE_URL: http://localhost:8080
      CODEX_HOME: /var/lib/efferva/codex
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${EFFERVA_HTTP_PORT:-8080}:8080"
    volumes:
      - codex-home:/var/lib/efferva/codex
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/agent/healthz')",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      - efferva-local

volumes:
  postgres-data:
  opensandbox-data:
  codex-home:

networks:
  efferva-local:
    name: efferva-local
