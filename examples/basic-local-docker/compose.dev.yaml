services:
  app:
    command:
      [
        "uvicorn",
        "basic_local_docker.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--reload",
        "--reload-dir",
        "/product/efferva-src",
        "--reload-dir",
        "/product/example-src",
      ]
    environment:
      PYTHONPATH: /product/example-src:/product/efferva-src
    volumes:
      - ../../src:/product/efferva-src:ro
      - ./src:/product/example-src:ro

  web:
    build:
      context: ../..
      dockerfile: examples/basic-local-docker/web/Dockerfile.dev
    restart: unless-stopped
    environment:
      EFFERVA_API_PROXY_TARGET: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${EFFERVA_WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/repo/examples/basic-local-docker/web
      - ../../packages/codex-client:/repo/packages/codex-client:ro
      - web-node-modules:/repo/examples/basic-local-docker/web/node_modules
    networks:
      - efferva-local

volumes:
  web-node-modules:
