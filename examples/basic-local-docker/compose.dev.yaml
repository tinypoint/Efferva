services:
  app:
    environment:
      PYTHONPATH: /product/efferva-src
    volumes:
      - ../../src:/product/efferva-src:ro

  worker:
    environment:
      PYTHONPATH: /product/efferva-src
    volumes:
      - ../../src:/product/efferva-src:ro

  web:
    build:
      context: ../..
      dockerfile: examples/basic-local-docker/web/Dockerfile.dev
    restart: unless-stopped
    environment:
      EFFERVA_API_PROXY_TARGET: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${EFFERVA_WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/web
      - ../../packages/codex-client:/packages/codex-client:ro
      - web-node-modules:/web/node_modules
    networks:
      - efferva-local

volumes:
  web-node-modules:
