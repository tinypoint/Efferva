name: efferva-multi-session-codex

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: efferva
      POSTGRES_USER: efferva
      POSTGRES_PASSWORD: efferva
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efferva -d efferva"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - efferva-multi-session-codex

  opensandbox-server:
    image: opensandbox/server:v0.2.2
    restart: unless-stopped
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "${OPENSANDBOX_HTTP_PORT:-8090}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - efferva-multi-session-codex

  app:
    image: efferva-multi-session-codex:local
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: examples/multi-session-codex/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox-server:
        condition: service_healthy
    environment:
      EFFERVA_DATABASE_URL: postgresql://efferva:efferva@postgres:5432/efferva
      EFFERVA_SANDBOX_IMAGE: ${EFFERVA_SANDBOX_IMAGE:-mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm}
      EFFERVA_SANDBOX_USERNAME: ${EFFERVA_SANDBOX_USERNAME:-node}
      EFFERVA_SANDBOX_UID: ${EFFERVA_SANDBOX_UID:-1000}
      EFFERVA_SANDBOX_GID: ${EFFERVA_SANDBOX_GID:-1000}
      EFFERVA_SANDBOX_HOME: ${EFFERVA_SANDBOX_HOME:-/home/node}
      EFFERVA_WORKSPACE_PATH: ${EFFERVA_WORKSPACE_PATH:-/home/node/workspace}
      EFFERVA_CODEX_HOME_PATH: ${EFFERVA_CODEX_HOME_PATH:-/home/node/.codex}
      EFFERVA_OPENSANDBOX_SERVER_URL: http://opensandbox-server:8090
      EFFERVA_OPENSANDBOX_API_KEY: local-dev-key
      EFFERVA_OPENSANDBOX_USE_SERVER_PROXY: "false"
      EFFERVA_CODEX_OPENAI_BASE_URL: ${EFFERVA_CODEX_OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EFFERVA_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/agent/healthz')",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      - efferva-multi-session-codex

volumes:
  postgres-data:
  opensandbox-data:

networks:
  efferva-multi-session-codex:
    name: efferva-multi-session-codex
