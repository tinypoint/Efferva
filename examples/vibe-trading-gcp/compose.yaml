name: efferva-vibe-trading

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: efferva
      POSTGRES_USER: efferva
      POSTGRES_PASSWORD: efferva
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efferva -d efferva"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - efferva-vibe-trading

  opensandbox-server:
    image: opensandbox/server:v0.2.2
    restart: unless-stopped
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "${OPENSANDBOX_HTTP_PORT:-8091}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    networks:
      - efferva-vibe-trading

  app:
    image: efferva-vibe-trading-app:local
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: examples/vibe-trading-gcp/Dockerfile
      target: app
      args:
        EFFERVA_WHEEL_URL: ${EFFERVA_WHEEL_URL:?set EFFERVA_WHEEL_URL to a Linux wheel URL}
        VIBE_TRADING_REVISION: ${VIBE_TRADING_REVISION:-0e004d7a98097a01751c5dd6adafa1a3afa3817d}
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox-server:
        condition: service_healthy
    environment:
      VIBE_TRADING_AGENT_RUNTIME: efferva
      VIBE_TRADING_PRODUCT_AUTH_MODE: dev
      VIBE_TRADING_PRODUCT_TENANT_ID: vibe-trading-local
      EFFERVA_DATABASE_URL: postgresql://efferva:efferva@postgres:5432/efferva
      EFFERVA_SANDBOX_PROVIDER: opensandbox
      EFFERVA_SANDBOX_IMAGE: efferva-vibe-trading-sandbox:local
      EFFERVA_OPENSANDBOX_SERVER_URL: http://opensandbox-server:8090
      EFFERVA_OPENSANDBOX_API_KEY: local-dev-key
      EFFERVA_OPENSANDBOX_USE_SERVER_PROXY: "true"
      EFFERVA_CODEX_OPENAI_BASE_URL: ${EFFERVA_CODEX_OPENAI_BASE_URL:-http://host.docker.internal:8317/v1}
      EFFERVA_CODEX_MODEL: ${EFFERVA_CODEX_MODEL:-gpt-5.4}
      EFFERVA_PUBLIC_BASE_URL: http://localhost:8899
      CODEX_HOME: /home/vibe/.codex
      LANGCHAIN_PROVIDER: openai
      LANGCHAIN_MODEL_NAME: ${EFFERVA_CODEX_MODEL:-gpt-5.4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${EFFERVA_CODEX_OPENAI_BASE_URL:-http://host.docker.internal:8317/v1}
    ports:
      - "${VIBE_TRADING_HTTP_PORT:-8899}:8899"
    volumes:
      - codex-home:/home/vibe/.codex
      - vibe-data:/home/vibe/.vibe-trading
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8899/live')",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      - efferva-vibe-trading

  sandbox-image:
    image: efferva-vibe-trading-sandbox:local
    profiles: ["images"]
    build:
      context: ../..
      dockerfile: examples/vibe-trading-gcp/Dockerfile
      target: sandbox
      args:
        EFFERVA_WHEEL_URL: ${EFFERVA_WHEEL_URL:?set EFFERVA_WHEEL_URL to a Linux wheel URL}
        VIBE_TRADING_REVISION: ${VIBE_TRADING_REVISION:-0e004d7a98097a01751c5dd6adafa1a3afa3817d}

volumes:
  postgres-data:
  opensandbox-data:
  codex-home:
  vibe-data:

networks:
  efferva-vibe-trading:
    name: efferva-vibe-trading
