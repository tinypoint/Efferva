name: Website

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check content and types
        run: npm run check

      - name: Build GitHub Pages output
        env:
          SITE_URL: https://tinypoint.github.io
          BASE_PATH: /Efferva
        run: npm run build

  pages-build:
    name: Prepare Pages artifact
    if: github.event_name != 'pull_request' && vars.EFFERVA_DOCS_PUBLISH == 'true'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          path: ./website
          node-version: 24
          package-manager: npm@latest
          build-cmd: npm run build
        env:
          SITE_URL: https://tinypoint.github.io
          BASE_PATH: /Efferva

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && vars.EFFERVA_DOCS_PUBLISH == 'true'
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
