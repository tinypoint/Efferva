[project]
name = "efferva"
version = "0.1.0"
description = "An embeddable Codex-based, AG-UI compatible agent framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "prometheus-client>=0.22,<1",
    "redis>=6.4,<7",
    "websockets>=15,<17",
]

[project.optional-dependencies]
opensandbox = [
    "opensandbox>=0.1.15,<0.2",
]

[build-system]
requires = [
    "hatchling>=1.27,<2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efferva"]
