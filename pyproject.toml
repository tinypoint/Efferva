[project]
name = "efferva"
version = "0.1.0"
description = "An embeddable Codex-based, AG-UI compatible agent framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
opensandbox = [
    "opensandbox>=0.1.15,<0.2",
]
dev = [
    "httpx2>=2,<3",
    "opensandbox>=0.1.15,<0.2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = [
    "hatchling>=1.27,<2",
    "packaging>=24,<27",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efferva"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build_hooks/runtime.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a PostgreSQL instance and built runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
