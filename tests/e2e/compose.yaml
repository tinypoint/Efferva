name: efferva-opensandbox-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: efferva
      POSTGRES_USER: efferva
      POSTGRES_PASSWORD: efferva
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efferva -d efferva"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - e2e

  sandbox-image:
    image: efferva-e2e-sandbox:local
    build:
      context: ../..
      dockerfile: docker/Sandbox.Dockerfile
    entrypoint: ["/bin/true"]
    networks:
      - e2e

  opensandbox-server:
    image: opensandbox/server:v0.2.2
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    networks:
      - e2e

  model-proxy:
    image: efferva-model-proxy:local
    build:
      context: ../..
      dockerfile: tests/e2e/Mock.Dockerfile
    networks:
      - e2e

  app:
    image: efferva-e2e-product:local
    build:
      context: ../..
      dockerfile: tests/e2e/Product.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox-server:
        condition: service_healthy
      model-proxy:
        condition: service_started
    environment:
      EFFERVA_DATABASE_URL: postgresql://efferva:efferva@postgres:5432/efferva
      EFFERVA_SANDBOX_PROVIDER: opensandbox
      EFFERVA_SANDBOX_IMAGE: efferva-e2e-sandbox:local
      EFFERVA_OPENSANDBOX_SERVER_URL: http://opensandbox-server:8090
      EFFERVA_OPENSANDBOX_API_KEY: e2e-key
      EFFERVA_OPENSANDBOX_USE_SERVER_PROXY: "true"
      EFFERVA_CODEX_OPENAI_BASE_URL: http://model-proxy:18090/v1
      EFFERVA_CODEX_MODEL: mock
      OPENAI_API_KEY: mock
      CODEX_HOME: /var/lib/efferva/codex
    ports:
      - "${EFFERVA_E2E_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/agent/healthz')",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      - e2e

volumes:
  opensandbox-data:

networks:
  e2e:
    name: efferva-e2e
