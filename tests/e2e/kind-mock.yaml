apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-proxy
  namespace: agentframe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-proxy
  template:
    metadata:
      labels:
        app: model-proxy
    spec:
      containers:
        - name: model-proxy
          image: agentframe-model-proxy:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18090
---
apiVersion: v1
kind: Service
metadata:
  name: model-proxy
  namespace: agentframe
spec:
  selector:
    app: model-proxy
  ports:
    - name: http
      port: 8000
      targetPort: http
