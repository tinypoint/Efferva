name: efferva

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: efferva
      POSTGRES_USER: efferva
      POSTGRES_PASSWORD: efferva
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efferva -d efferva"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - efferva

  sandbox-image:
    image: efferva-sandbox:local
    build:
      context: ..
      dockerfile: Efferva/docker/Dockerfile
      target: sandbox
    entrypoint: ["/bin/true"]
    networks:
      - efferva

  app:
    image: efferva-app:local
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Efferva/docker/Dockerfile
      target: app
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    environment:
      EFFERVA_DATABASE_URL: postgresql://efferva:efferva@postgres:5432/efferva
      EFFERVA_SANDBOX_PROVIDER: docker
      EFFERVA_SANDBOX_IMAGE: efferva-sandbox:local
      EFFERVA_DOCKER_NETWORK: efferva
      EFFERVA_PUBLIC_BASE_URL: http://localhost:8080
      CODEX_HOME: /var/lib/efferva/codex
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${EFFERVA_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - codex-home:/var/lib/efferva/codex
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - efferva

volumes:
  postgres-data:
  codex-home:

networks:
  efferva:
    name: efferva
    external: true
